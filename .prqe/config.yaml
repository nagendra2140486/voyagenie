# PRQE run configuration.
#
# The PRQE playbooks (PR analysis, heartbeat, functional, performance, final analysis) are shared
# across repositories and name nothing repo-specific. Everything they need to know about this
# repository's layout is declared here, so onboarding a new repo is a config file rather than a
# playbook fork.
#
# Placeholders substituted at run time: {backend_url} {frontend_url} {ai_url} {pr_id} {run_id}
# {commit} {report_dir} {selection}

schemaVersion: 1

app:
  name: voyagenie
  repository: https://github.com/Cognizant-FrontierAICyberDefense/voyagenie/

# Services the deployed environment exposes. CRaaS supplies the URLs; absent ones make the
# stages that need them fail fast rather than probing localhost.
services:
  backend:
    url: "{backend_url}"
    health: /health
  frontend:
    url: "{frontend_url}"
  ai_service:
    url: "{ai_url}"
    health: /health

heartbeat:
  script: ops/heartbeat/heartbeat.py
  command: >-
    python3 ops/heartbeat/heartbeat.py
    --backend-url {backend_url} --frontend-url {frontend_url} --ai-url {ai_url}
    --run-id {run_id} --appname voyagenie --commit {commit}
    --out-dir {report_dir}
  # 0 healthy · 1 a check failed · 2 never became ready
  exit_codes: {healthy: 0, failed: 1, not_ready: 2}
  report: "{report_dir}/heartbeat.md"

publisher:
  command: >-
    python3 ops/reporting/publish_report.py --file {file} --reporttype {reporttype}
    --pr-id {pr_id} --appname voyagenie
    --repository https://github.com/Cognizant-FrontierAICyberDefense/voyagenie/

impact:
  # Closed vocabulary: selections are validated against this file.
  spec_inventory: tests/spec-inventory.json
  # Recorded evidence of what each test exercises.
  coverage_map: tests/coverage-map.json
  # Express mounts, parsed to map a backend route file to the endpoints it owns.
  backend_mounts: backend/src/index.ts
  # Any change matching these runs the full suite regardless of what the maps say.
  force_full:
    - db/*.sql
    - backend/src/config.ts
    - .env.example
    - "**/package.json"
    - "**/package-lock.json"
  # Always run, whatever the diff touched.
  mandatory_specs:
    - e2e/guardrails.spec.ts
  # Heartbeat only; no functional signal to gain.
  low_signal:
    - "**/*.md"
    - "**/tsconfig*.json"
    - .gitignore
    - eslint.config.js
  # Languages the coverage map cannot resolve; changes here get a representative test plus an
  # explicit coverage-gap entry rather than a false mapping.
  unmapped_paths:
    - ai-service/**

functional:
  runner: playwright
  working_dir: tests
  install: npm install
  command: npx playwright test
  select_flag: --grep
  # An empty selection must skip the stage; an empty --grep matches every test.
  empty_selection: skip
  env:
    VOYAGENIE_BASE_URL: "{frontend_url}"
    VOYAGENIE_API_URL: "{backend_url}"

performance:
  runner: k6
  command: >-
    k6 run -e VOYAGENIE_API_URL={backend_url}
    --summary-export {report_dir}/k6-summary.json perf/critical-journeys.js
  # Only recommend performance for changes that could plausibly move latency.
  triggers:
    - backend/src/**
    - db/*.sql
    - "**/package.json"

reports:
  dir: reports/{run_id}
  # CRaaS accepts a closed enum; `heartbeat` does not exist yet, so it shares verdict-report.
  types:
    pr_analysis: prqe-analysis
    impact: impact-analysis
    functional: regression-report
    performance: perf-report
    heartbeat: verdict-report
    verdict: verdict-report
    failure: failure-analysis
