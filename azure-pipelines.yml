trigger: none

parameters:
- name: payload
  type: string
  default: ''

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- task: UseNode@1
  inputs:
    version: '20.x'

- script: |
    npm ci
  displayName: 'Install Dependencies'

- script: |
    npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

- script: |
    echo '${{ parameters.payload }}' > payload.json
  displayName: 'Save Agent Payload'

- script: |
    node process-payload.js
  displayName: 'Execute Impacted Tests'

- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: 'results.json'
    artifact: 'json-results'