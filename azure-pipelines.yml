trigger: none

parameters:
- name: payload
  type: string
  default: ''

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- task: UseNode@1
  displayName: 'Install Node.js'
  inputs:
    version: '20.x'

- script: |
    npm ci
  workingDirectory: tests
  displayName: 'Install Dependencies'

- script: |
    npx playwright install --with-deps
  workingDirectory: tests
  displayName: 'Install Playwright Browsers'

- script: |
    printf '%s' "$PAYLOAD" > payload.json

    echo "Payload saved successfully"

    ls -la

  workingDirectory: tests
  displayName: 'Save Incoming Payload'

  env:
    PAYLOAD: ${{ parameters.payload }}

- script: |
    node execute-impacted-tests.js
  workingDirectory: tests
  displayName: 'Execute Regression Tests'

- script: |
    echo "===== REGRESSION REPORT ====="

    cat regression-report.json

    echo ""
    echo "===== REPORT SIZE ====="

    wc -c regression-report.json

  workingDirectory: tests
  displayName: 'Debug Regression Report'
  condition: always()

- script: |
    echo "Publishing regression report"

    RESPONSE=$(curl -s \
      --location \
      --request POST \
      --header "Content-Type: application/json" \
      --data @regression-report.json \
      --write-out "\nHTTP_STATUS:%{http_code}" \
      "https://claude-agent-services-e9g8gzh8d3fgbxe6.canadacentral-01.azurewebsites.net/api/publish")

    echo "===== API RESPONSE ====="
    echo "$RESPONSE"

    HTTP_STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

    echo "HTTP STATUS = $HTTP_STATUS"

    if [ "$HTTP_STATUS" -ge 400 ]; then
      echo "API call failed"
      exit 1
    fi

  workingDirectory: tests
  displayName: 'Publish Regression Report'
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: 'Publish Regression Report Artifact'
  condition: always()
  inputs:
    targetPath: 'tests/regression-report.json'
    artifact: 'regression-report'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright Results'
  condition: always()
  inputs:
    targetPath: 'tests/results.json'
    artifact: 'playwright-results'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Test Evidence'
  condition: always()
  inputs:
    targetPath: 'tests/test-results'
    artifact: 'test-results'