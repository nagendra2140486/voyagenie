trigger:
- nagendra/functionaltests

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

- task: UseNode@1
  displayName: 'Install Node.js'
  inputs:
    version: '20.x'

- script: |
    npm ci
  workingDirectory: tests
  displayName: 'Install Dependencies'

- script: |
    npx playwright install --with-deps
  workingDirectory: tests
  displayName: 'Install Playwright Browsers'

- script: |
    npx playwright test --reporter=json > playwright-raw.json
  workingDirectory: tests
  displayName: 'Run Playwright Tests'
  continueOnError: true
  env:
    VOYAGENIE_BASE_URL: 'https://voyagenie-app.azurewebsites.net/'
    CI: 'true'

- script: |
    echo "Generating JSON output..."

    if [ -f playwright-raw.json ]; then
      cp playwright-raw.json results.json
      echo "===== RESULTS.JSON ====="
      cat results.json
    else
      echo '{"status":"FAILED","message":"playwright-raw.json not found"}' > results.json
      cat results.json
    fi
  workingDirectory: tests
  displayName: 'Generate JSON Output'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Test Evidence'
  condition: always()
  inputs:
    targetPath: 'tests/test-results'
    artifact: 'test-results'

- task: PublishPipelineArtifact@1
  displayName: 'Publish JSON Results'
  condition: always()
  inputs:
    targetPath: 'tests/results.json'
    artifact: 'json-results'