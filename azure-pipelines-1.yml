trigger: none

variables:
- group: PAT

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- task: UseNode@1
  displayName: 'Install Node.js'
  inputs:
    version: '20.x'

#
# Clone Voyagenie Repository
#

- script: |
    git clone \
      --branch nagendra/functionaltests \
      https://github.com/nagendra2140486/voyagenie.git \
      app

  displayName: 'Clone Voyagenie Repository'

#
# Install k6
#

- script: |
    sudo apt-get update

    sudo apt-get install -y \
      gnupg \
      software-properties-common

    curl -fsSL https://dl.k6.io/key.gpg | \
      sudo gpg --dearmor \
      -o /usr/share/keyrings/k6-archive-keyring.gpg

    echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
      sudo tee /etc/apt/sources.list.d/k6.list

    sudo apt-get update

    sudo apt-get install -y k6

  displayName: 'Install k6'

#
# Verify k6
#

- script: |
    k6 version

  displayName: 'Verify k6'

#
# Verify API Endpoint
#

- script: |
    echo "Testing API Endpoint"

    curl