trigger: none

variables:
- group: PAT

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- task: UseNode@1
  displayName: 'Install Node.js'
  inputs:
    version: '20.x'

#
# Clone Voyagenie Repository
#

- script: |
    git clone \
      --branch nagendra/functionaltests \
      https://github.com/nagendra2140486/voyagenie.git \
      app

  displayName: 'Clone Voyagenie Repository'

#
# Install k6
#

- script: |
    sudo apt-get update

    sudo apt-get install -y \
      gnupg \
      software-properties-common

    curl -fsSL https://dl.k6.io/key.gpg | \
      sudo gpg --dearmor \
      -o /usr/share/keyrings/k6-archive-keyring.gpg

    echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
      sudo tee /etc/apt/sources.list.d/k6.list

    sudo apt-get update

    sudo apt-get install -y k6

  displayName: 'Install k6'

#
# Verify k6
#

- script: |
    k6 version

  displayName: 'Verify k6'

#
# Execute Performance Tests
#

- script: |
    k6 run \
      perf/critical-journeys.js \
      --summary-export=performance-report.json

  workingDirectory: app

  displayName: 'Execute Performance Tests'

  env:
    VOYAGENIE_API_URL: $(VOYAGENIE_API_URL)

  continueOnError: true

#
# Generate PRQE Performance Report
#

- script: |
    node perf/generate-performance-report.js

  workingDirectory: app

  displayName: 'Generate Performance Analysis'

  condition: always()

#
# Publish Performance Summary
#

- script: |
    cat > performance-summary.md << EOF
    # PRQE Performance Execution

    Performance testing completed.

    See performance-analysis artifact for detailed results.
    EOF

    echo "##vso[task.uploadsummary]$(pwd)/performance-summary.md"

  workingDirectory: app

  displayName: 'Publish Performance Summary'

  condition: always()

#
# Publish Performance Analysis
#

- task: PublishPipelineArtifact@1
  displayName: 'Publish Performance Analysis'

  condition: always()

  inputs:
    targetPath: 'app/performance-analysis.json'
    artifact: 'performance-analysis'

#
# Publish Raw k6 Report
#

- task: PublishPipelineArtifact@1
  displayName: 'Publish Raw k6 Report'

  condition: always()

  inputs:
    targetPath: 'app/performance-report.json'
    artifact: 'performance-raw'

#
# Publish Performance Assets
#

- task: PublishPipelineArtifact@1
  displayName: 'Publish Performance Assets'

  condition: always()

  inputs:
    targetPath: 'app/perf'
    artifact: 'performance-assets'